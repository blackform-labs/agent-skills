<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brief review fixture</title>
<style>
  * { box-sizing: border-box }
  body { margin: 16px; font: 16px/1.4 system-ui }
  main, .rows, .intro { display: grid; gap: 8px }
  main { max-width: 40rem; gap: 16px }
  .card { border: 1px solid; padding: 16px; border-radius: 12px }
  h1, h2, p { margin: 0 }
  button { width: 120px; height: 48px; border: 0; border-radius: 0 }
  .rows > p { min-height: 24px }
  .spacing .intro { gap: 40px }
  .spacing .rows > :last-child { margin-top: 24px; margin-left: 12px }
  .spacing .card:last-of-type { padding: 25px; border-radius: 3px }
  .spacing .region { height: 180px }
  .clipping .summary { height: 10px; overflow: hidden }
  @media (max-width: 600px) {
    .responsive .summary { width: 620px }
    .responsive button { height: 32px }
  }
</style>
<script>
  const scenario = new URLSearchParams(location.search).get("case")
  if (["spacing", "clipping", "responsive"].includes(scenario)) document.documentElement.classList.add(scenario)
</script>
<main id="brief">
  <button id="save">Save draft</button>
  <section id="idea" class="card" data-ui-role="card" data-ui-spacing="inset">
    <div class="intro"><h1>Review draft</h1><p>Check the details of your next workshop.</p></div>
    <div class="rows" data-ui-group="details">
      <p>Workshop</p><p>Audience</p><p>Location</p><p>Availability</p>
    </div>
  </section>
  <section id="feedback" class="card" data-ui-role="card" data-ui-spacing="inset">
    <div class="region"><h2>Feedback</h2></div>
    <p class="summary">A longer summary can wrap at a narrow width and still meet the layout contract.</p>
  </section>
</main>
</html>
